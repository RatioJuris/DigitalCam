name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    env:
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-binary-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-windows-${{ hashFiles('vcpkg.json') }}

      - name: Install vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics

      - name: Install dependencies
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          & "$env:VCPKG_ROOT\vcpkg.exe" install --triplet x64-windows

      - name: Configure
        run: |
          cmake -S . -B build `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DDIGITALCAM_BUILD_PLATFORM_ADAPTERS=ON `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Bundle runtime dependencies
        shell: pwsh
        run: |
          $output = "build/app/Release"
          $root = "build/vcpkg_installed/x64-windows"
          $runtime = Join-Path $root "bin"
          if (Test-Path $runtime) {
            Copy-Item -Path "$runtime\*.dll" -Destination $output -Force
          }
          $qwindows = Get-ChildItem -Path $root -Recurse -Filter qwindows.dll -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($qwindows) {
            $pluginRoot = Split-Path $qwindows.DirectoryName -Parent
            Copy-Item -Path (Join-Path $pluginRoot '*') -Destination $output -Recurse -Force
          }
          $virtualCameraBin = "build/virtual_camera/windows/Release"
          Copy-Item -Path "$virtualCameraBin/DigitalCamVirtualCamera.dll" -Destination $output -Force
          Copy-Item -Path "$virtualCameraBin/DigitalCamCameraInstaller.exe" -Destination $output -Force
          Compress-Archive -Path "$output\*" -DestinationPath "DigitalCamStudio-0.1.0-windows-x64.zip" -Force

      - name: Upload Studio artifact
        uses: actions/upload-artifact@v4
        with:
          name: DigitalCamStudio-Windows-x64
          path: DigitalCamStudio-0.1.0-windows-x64.zip
          if-no-files-found: error

  ubuntu:
    name: Ubuntu 24.04 x64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            ninja-build \
            qt6-base-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswresample-dev \
            libswscale-dev \
            libgtest-dev \
            libspdlog-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Upload Studio artifact
        uses: actions/upload-artifact@v4
        with:
          name: DigitalCamStudio-Linux-x64
          path: build/app/DigitalCamStudio
          if-no-files-found: warn
